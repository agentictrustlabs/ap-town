# The faithchain town (spec 429). One chain; every estate on it; the services they share.
# Every town app, check and generator reads THIS file (packages/town-model). Nothing in it grants anything (D2):
# a row says a service is listed — whether anyone may use it is their own delegation's question.
town: faithchain
status: live
chain:
  id: 34348
  generation: "1"
  rpc: https://rpc.faithnet.io
  deployment: faithchain   # @agenticprimitives/contracts/deployments — the one source of addresses
  coin: { address: "0xa14E4a9447607c1233DcE34dB6Ead47C094f6141", symbol: SHQ, decimals: 6 }   # Sheqel — names are bought with it (spec 431)

# Spec 437 I4 — the accounts the town's resources live in (ids and labels only; tokens are the town agent's secrets) and,
# per estate and service, the resources each owns. A Worker listed nowhere shows in the Pulse's Unattributed bucket.
accounts:
  cloudflare:
    - { id: 5da2feaa56593839672948e16c6e809d, label: faithnet-town }
    - { id: 0a1fdbaf6dc871dd3faf7a8d0dc6c534, label: richcanvas }
  vercel: { teamId: team_5pDHXIoVgGTQ5zs7s0RQJ0Ta, label: rpedersen3s-projects }
  azure: { subscriptionId: 5a656e13-849d-4b56-9101-53f987cf971b, resourceGroups: [rg-faithnet, rg-akcs-pilot-westus], label: faithchain-node }
  graphdb: { url: https://graphdb.agentkg.io, label: ontotext }

# WHAT THE TOWN RUNS ON THAT NOTHING METERS (spec 437 I4). The Pulse measures four platforms because four
# have APIs that answer; the rest of the bill is real and invisible. Declared here so the Inventory page can
# show it beside the measured half, labelled as declared. NO AMOUNTS: this file is public, and money is the
# operator's read — the figures come from the providers, on the Cost tab.
vendors:
  - { id: cloudflare, what: 'Workers, Durable Objects, D1, KV, Queues, Vectorize, Pages and DNS — most of what the town is', billing: usage, metered: cloudflare, where: 'dash.cloudflare.com (two accounts)', note: 'a platform fee per account; the meters themselves sit inside the included tiers at this volume' }
  - { id: azure, what: 'the chain node, and the AKCS key-custody pilot (VMs, Postgres, registry, bastion, key vault)', billing: usage, metered: azure, where: 'portal.azure.com — subscription 5a656e13…', note: 'the largest line by a wide margin; the AKCS pilot is most of it' }
  - { id: vercel, what: 'the estates'' Homes and the developer site', billing: plan, metered: vercel, where: 'vercel.com/rpedersen3s-projects', note: 'a Pro team; build minutes are most of the usage' }
  - { id: graphdb, what: 'Ontotext GraphDB — the public knowledge graph the registry reads', billing: plan, metered: graphdb, where: graphdb.agentkg.io, note: 'health and repositories are measured; the hosting bill is not in any account the Pulse reads' }
  - { id: github, what: 'source for every repository, and the CI that builds and releases them', billing: plan, where: 'github.com/agentictrustlabs + RichCanvas3', note: 'seats are the plan; Actions minutes on PRIVATE repositories are the variable part — public ones are unmetered' }
  - { id: npm, what: 'the published @agenticprimitives packages every product installs', billing: free, where: npmjs.com/org/agenticprimitives, note: 'public packages; publishing is GitHub OIDC trusted publishing, so there is no token and no cost' }
  - { id: domains, what: 'eight zones — faithnet.me/.io/.ai, impact-agent.me/.io/.ai, agentkg.io, agenticprimitives.dev', billing: per-unit, note: 'four on Cloudflare DNS, four on Vercel DNS; renewals are annual and .ai is the expensive one' }
  - { id: gcp-kms, what: 'three keys in the a2a keyring — relay, envelope, interactions-session', billing: per-unit, where: 'console.cloud.google.com — project churchcore2', note: 'custodies BASE SEPOLIA only; faithchain is on AKCS. Cents per key-version per month plus operations' }
  - { id: cloudflare-email, what: 'Email Sending and Email Routing — the one rail the estates send and receive on', billing: usage, where: 'inside the Cloudflare accounts', note: 'a Worker may only send to addresses verified in the account, so an invitation to a stranger needs a rail no estate currently has' }
  - { id: upstash-redis, what: 'Vercel KV — the Home broker''s nonces and sessions', billing: usage, where: 'inside the Vercel team', note: 'no separate line appears on the invoice at this volume' }
  - { id: google-oauth, what: 'sign-in with Google at a Home', billing: free, where: 'console.cloud.google.com' }

# WHO MAY READ THE OPERATOR VIEW (spec 437 I7) — by Smart Agent, verified from the `id_token` their own Home
# issues when they Connect at the portal. It replaces pasting the shared ops token into a browser: a secret
# cannot be attributed to a person or revoked for one of them. The token still works, for scripts and crons.
# Listing somebody here GRANTS THEM NOTHING (429 D2): it unlocks a read of aggregate numbers this deployment
# already holds — no Home, no person's record, no act. Absent or empty means nobody, which is the safe reading.
operators:
  - { sa: '0x840bb6480c7bb37910631db62f7212f0ba73f3a8', label: Town Operator, note: 'operates the faithchain town services; custodian of discovery.registry' }
  - { sa: '0x6142b0fca982f6701cf2248bf368ab44a48c5725', label: Demo Admin, note: 'charters the town and estate context agents (spec 436 §5.5)' }

estates:
  - id: faithnet
    repo: agentictrustlabs/ap-home
    home: https://www.faithnet.me
    edge: https://edge.faithnet.io
    a2a: https://a2a.faithnet.io
    agentZone: faithnet.ai
    # Same Cloudflare account as the town Workers: its public lane is reached through these Workers (CF-1042: a
    # Worker's subrequest to a same-account workers.dev host returns a 404 page). Generated into each town Worker
    # that reads lanes (`pnpm gen:town`); the skills service copies the edge's line.
    lanes:
      edge.faithnet.io: demo-edge-faithnet
      demo-edge-faithnet.richardpedersen3.workers.dev: demo-edge-faithnet
      "*.faithnet.ai": demo-a2a-faithnet
    nameRoots: [me, org, team, svc, workspace, treasury, registry, church, circle, impact]
    # The estate's own agent on this chain. A person's agent carries this NAME in `atl:estate`, and this
    # agent carries the Home's URL in `atl:homepage` — the name is stable, the URL moves.
    estateName: faithnet.estate
    # The gate whose signature authorizes a priced registration from this Home (allowed on every priced
    # root at block 78766; it signed nate-the-baker, richcanvas45, x102abc, nate-trial-889 while it was
    # the only gate on the chain). This is what makes the estate a question the CHAIN answers.
    namingGate: "0x640D577Bcb3fd860743ED315620085704c1483E9"
    # ON NEUTRAL GROUND SINCE 2026-10-14 (spec 439; ap-federation federation.yaml). The estate agent `faithnet.estate`
    # is PERSONA-CUSTODIED — salt 2 over the demo-admin persona, the owner's choice ("a type of .estate for each") —
    # and is NOT `faith-estate.workspace`, which stays the Pulse's context agent (436 §5.5). It declared its
    # projection signer on this chain, so the registration is chain-verifiable both ways.
    projection:
      registry: "0xb4E116F5C6915a4f1e649E0877e4a0A7a1c1147b"
      registryChainId: 34348
      governance: "0x3273f419FDfc7eA1Bf14372C4A9CA5fC43818F64"   # faithnet.estate
      estateId: "0x465f13a19d48b6bd58e9c792956cbf477cd35ed395fdd38dbe8250e262e40264"
      signer: "0x9d0C710b73a9E0CD103A1A7034F871C852d8657e"
      declaredOnChain: true
    kms: { tenant: faithnet }
    # Spec 437 I4 — the estate's own Cloudflare Workers (its A2A runtime, its vault, its edge, its Home MCP, its
    # approval door) and its Vercel project (the Home itself). The unsuffixed twins are the same apps' dev
    # environments on the same account: an estate's staging is still the estate's.
    # The unsuffixed twins are GONE (2026-10-13): `demo-a2a` was deleted with the Base Sepolia / Impact
    # estate's decommission, and `demo-mcp` / `demo-edge` never existed on this account (Cloudflare 10007) —
    # they were aspirational dev environments. `home-mcp` stays: it does exist.
    workers: [demo-a2a-faithnet, demo-mcp-faithnet, demo-edge-faithnet, home-mcp-faithnet, harness-approval-faithnet,
              home-mcp]
    vercelProjects: [faithnet-home]
    # The estate's MCP servers (spec 435 §5). DECLARED, not read off the Worker names: `demo-mcp-faithnet` is
    # the vault and `home-mcp-faithnet` is the Home's entrance, and no spelling rule tells you which is which.
    mcpServers:
      - id: vault
        worker: demo-mcp-faithnet
        exposure: authenticated
        url: https://mcp.faithnet.io
        probe: https://mcp.faithnet.io/health
        description: >-
          Every agent's vault, behind a private MCP. The authorization decision is the Web3 chain every call —
          on-chain delegation, signature validation, entitlement, tool policy — re-run server-side against the
          principal agent; a token at the door is at most the envelope it arrived in (ADR-0041).
      - id: home
        worker: home-mcp-faithnet
        exposure: authenticated
        url: https://home-mcp.faithnet.io
        probe: https://home-mcp.faithnet.io/health
        description: >-
          The Home's own MCP and OAuth 2.1 server (spec 397) — the entrance an outside client such as Claude.ai
          uses to reach a person's agent. It carries her `ask-as-me` delegation, never the bearer, and an act
          still parks for her signature at her Home.

  # THE SECOND ESTATE on this chain, on default platform names by the owner's instruction (2026-10-11): no
  # faithnet DNS. SUPERSEDED 2026-10-13: it now has its own zones (see the row below). The rule it illustrated
  # still holds and is the reason the switch is safe — a name resolves to an endpoint FROM THE CHAIN, and a
  # subdomain is never the authority, so giving an estate real hosts is a routing change and never a trust one.
  # impact-agent LEFT THIS TOWN on 2026-10-14 for hopenet (towns/hopenet/town.yaml), so the federation twin runs
  # across two chains rather than two estates on one. Recorded rather than silently deleted: a reader in a year
  # should find out where the estate went. Its row moved whole — same Home, zones, lanes, name roots, Workers —
  # because an estate is a Home and the people under it, not a chain.
  #
  # ITS NAMING GATE (0xb59e824C…) AND THE NAMES IT SIGNED STAY HERE. A name is bought on a chain and lives on
  # it: `imbrichgoogle.me` and the rest are still faithchain records owned by faithchain accounts, and moving
  # the estate neither did nor could move them. The gate is RETIRED, never reassigned — a gate address is what
  # tells one estate's names from another's, so handing it on would make the chain answer confidently with the
  # wrong estate. Residents who want those names on the new chain claim them there; spec 440 §C's universal
  # namespace is what would make that one name rather than two, and it is not built yet.
services:
  # ── The town's own services (deployed from this repository) ───────────────────────────────────────────────
  - id: registry
    kind: commons
    repo: ap-town
    app: apps/registry
    worker: demo-discovery-a2a-faithnet
    agentName: discovery.registry
    hosts: [discovery-a2a.faithnet.town, discovery-a2a.faithnet.io]
    probe: https://discovery-a2a.faithnet.io/health
    card: https://discovery-a2a.faithnet.io/.well-known/agent-card.json
    description: The town's registry — the discovery.registry agent, its ARD document, ACP registry and search.
  - id: discovery-mcp
    kind: commons
    repo: ap-town
    app: apps/discovery-mcp
    worker: demo-discovery-mcp-faithnet
    hosts: []
    mcp: { exposure: binding }
    description: Reads the public graph and the retrieval index for the registry. Reachable only by service binding.
  - id: discovery-indexer
    kind: commons
    repo: ap-town
    app: apps/discovery-indexer
    worker: demo-discovery-indexer-faithnet
    hosts: []
    description: The only writer of the public graph and the retrieval index; crawls every estate's name roots.
  - id: discovery-connector
    kind: commons
    repo: ap-town
    app: apps/discovery-connector
    worker: demo-discovery-connector-faithnet
    hosts: [discovery-connector.faithnet.town, discovery-connector.faithnet.io]
    probe: https://discovery-connector.faithnet.io/health
    # The one MCP server in this town with a door an anonymous client may knock on. It is read-only and it
    # reads the public graph, which anybody could read from the chain anyway (ADR-0040) — so there is nothing
    # behind this door that being admitted would disclose.
    mcp: { exposure: open }
    description: Public read-only MCP for external assistants, over the registry's search.
  - id: discovery-web
    kind: commons
    repo: ap-town
    app: apps/discovery-web
    worker: demo-discovery-web-faithnet
    hosts: [discovery.faithnet.town, discovery.faithnet.io]
    probe: https://discovery.faithnet.io/
    description: The explorer's old host — the registry's documents at their well-known paths, and a redirect to the portal's Find.
  - id: town-agent
    kind: commons
    repo: ap-town
    app: apps/town-agent
    worker: faithchain-town-agent
    hosts: [faithnet.town, town.faithnet.io]
    probe: https://town.faithnet.io/api/health
    card: https://town.faithnet.io/.well-known/agent-card.json
    description: The town's own agent — what this town offers and whether each service is up. Lists; never grants.
  - id: town-mcp
    kind: commons
    repo: ap-town
    app: apps/town-mcp
    worker: faithchain-town-mcp
    hosts: []
    workers: []
    mcp: { exposure: binding }
    description: The town's private MCP (spec 437 §4) — the only place a platform read credential lives, and the only thing that reads Cloudflare, Vercel, Azure and GraphDB. No hostname; reachable only by service binding from the town agent. It reads; it acts for nobody.
  - id: naming
    kind: commons
    repo: ap-town
    app: apps/naming
    worker: faithchain-naming
    hosts: [names.faithnet.town, names.faithnet.io]
    probe: https://names.faithnet.io/api/health
    description: The town's naming service — every name on the chain, what it points at, and who can change it. It reads; an owner's Home writes.
  - id: inference
    kind: commons
    repo: ap-town
    app: apps/inference
    worker: faithchain-inference
    hosts: [inference.faithnet.town, inference.faithnet.io]
    probe: https://inference.faithnet.io/healthz
    description: The town's model gateway (spec 434) — provider keys live on this Worker and nowhere else; it routes a call to a provider by budget and records the route it chose. It answers; it decides no authority.
  - id: chain-gateway
    kind: commons
    repo: ap-town
    app: apps/chain-gateway
    worker: faithchain-rpc-gateway
    workers: [chain-rpc-gateway]
    hosts: [rpc.faithnet.town, rpc.faithnet.io]
    probe: https://rpc.faithnet.io/healthz
    azureResources: [/subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-FAITHNET/providers/Microsoft.Compute/virtualMachines/faithnet-vm]
    # The whole group is this service's: the node VM, its data and OS disks, its public IP — nothing else is
    # billed in it. Azure's cost rows name a GROUP, so without this line every faithchain-node dollar reads as
    # unattributed (checked 2026-10-13: 3 resources, ~$5.6/day).
    azureResourceGroups: [rg-faithnet]
    description: Chain access — per-app tokens, method allow-list, rate limits — in front of the faithchain node.

  # ── Commons deployed from their own repositories ──────────────────────────────────────────────────────────
  - id: skills
    kind: commons
    repo: agentictrustlabs/skills
    hosts: [skills.faithnet.town, skills.faithnet.io]
    probe: https://skills.faithnet.io/
    workers: [skills-web-faithnet, skills-web, skills-a2a, skills-corpus, skills-mcp, skills-ontology]
    # The registry's own interface is a website; its tools Worker is an MCP server behind a binding beside it.
    # It has NO public route on purpose: it takes its caller's word for `author` because skills-a2a has already
    # verified the id_token, and a hostname would turn "trusts its caller" into "trusts the internet" over an
    # append-only log that cannot un-write a forged leaf.
    mcpServers:
      - id: skills
        worker: skills-mcp
        exposure: binding
        description: The skills corpus's tools and store — publish and read SKILL.md contracts. No public route by design.
    description: The skills registry — SKILL.md contracts and playbooks, pinned by digest.
  - id: kms
    kind: commons
    repo: agentictrustlabs/faithkms
    hosts: [akcs-pilot.faithnet.io]
    probe: https://akcs-pilot.faithnet.io/healthz
    azureResources: [/subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-pilot-0,
                     /subscriptions/5a656e13-849d-4b56-9101-53f987cf971b/resourceGroups/RG-AKCS-PILOT-WESTUS/providers/Microsoft.Compute/virtualMachines/vm-akcs-tunnel-pilot]
    # The AKCS pilot's whole group. The two VMs are the small half: the bastion, the Postgres flexible server,
    # the container registry, the key vault, the load balancer, the private endpoints and the disks are billed
    # here too and are most of it (18 resources, ~$20/day on 2026-10-13). Declaring the group claims them all,
    # which is true of this group and must be re-checked before anything unrelated is deployed into it.
    # THE FEDERATION'S SHARED OPERATOR (ap-federation spec 440 §A, 2026-10-14): one AKCS operator serves every town;
    # the operator record — host, tenants, callers, the four conditions — is `federation.yaml#kms` in ap-federation
    # and this row declares it BY REFERENCE. One tenant per estate, always (a tenant is a derivation root). Not
    # neutral ground, not a root, not required: `key-custody` is a port.
    azureResourceGroups: [rg-akcs-pilot-westus]
    description: Key custody (AKCS) — the federation's shared operator (ap-federation federation.yaml#kms); a tenant per estate, never shared; keys are delegates, never identities.

  # ── Applications ──────────────────────────────────────────────────────────────────────────────────────────
  # LISTED, NEVER MOVED (spec 429 §1) — the people-group MCP beside `people-groups.svc`, deployed from ap-demos
  # on the richcanvas account. It is here so the town can say WHAT serves that hostname: without a declaration
  # the agent page reads "this town's manifest declares nothing that serves this host", which is the honest
  # answer to an undeclared host and a useless one for a host somebody in this town does declare an endpoint at.
  # A hostname that looks like a Worker name is not a declaration — so this is the declaration.
  - id: people-groups-mcp
    kind: application
    repo: agentictrustlabs/ap-demos
    worker: demo-gc-pg
    hosts: [demo-gc-pg.r-pedersen.workers.dev]
    probe: https://demo-gc-pg.r-pedersen.workers.dev/health
    estates: [faithnet]
    workers: [demo-gc-pg]
    mcpServers:
      - id: people-groups
        agentName: people-groups.svc
        worker: demo-gc-pg
        # OPEN, and said so rather than implied: it answers an anonymous MCP client with public counts.
        # ADR-0057 makes an MCP endpoint a private capability interface by default and absent from every
        # Agent Card; this one is a read-only interop surface, which the enum has a word for.
        exposure: open
        url: https://demo-gc-pg.r-pedersen.workers.dev/mcp
        probe: https://demo-gc-pg.r-pedersen.workers.dev/health
        description: >-
          People-group counts from the Global.Church graph, by list (Joshua Project, IMB, the UUPG+ Base List)
          for a country, with religion and affinity-bloc filters. The MCP `people-groups.svc` names in its own
          `atl:mcpEndpoint` record, which is how the harness binds its `peoplegroup.*` reads — by record, never
          by hostname. Counts with their publisher named; no authority, no sessions, no write.
    description: >-
      The people-group MCP beside the Global.Church people-groups service agent — public counts from the GC
      graph through the GC gateway. The gateway credential lives on the Worker alone, never in the agent.
  - id: gamenight
    kind: application
    repo: agentictrustlabs/pokernight
    hosts: [gamenight.faithnet.io, games.faithnet.io, agents.faithnet.io]
    probe: https://gamenight.faithnet.io/
    estates: [faithnet]
    workers: [pokernight-web-faithnet, pokernight-agent-worker-faithnet, pokernight-tables-faithnet,
              pokernight-web, pokernight-agent-worker, pokernight-tables]
    description: Game Night — people and agents at the same tables, including Field Operations.

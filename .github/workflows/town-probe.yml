name: town-probe

# The HEALTHY signal for every listed service of every town (spec 429 D7), hourly. Red when a probed service is down.
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm probe:town

# The town's own Worker (spec 429 §2.2 + §7): the Town portal at /, its read API under /api/*, the town agent's A2A
# door at /a2a. Public, read-only, keyless: it answers from the town manifest, live probes, and two bound town services.
name = "town-agent"
main = "worker/index.ts"
compatibility_date = "2026-05-20"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/a2a", "/.well-known/*"]

[vars]
TOWN = "faithchain"
PUBLIC_ORIGIN = "http://localhost:8792"

# The Pulse (spec 434 §10 / 436 §5.3): a sample every five minutes into HeartbeatDO (30 days). Secrets:
#   TOWN_OPS_TOKEN (the two gateways' /ops/summary; also the operator's detail read of /api/pulse) · ESTATE_HEARTBEAT_TOKENS (JSON estate id → token for GET <a2a>/ops/heartbeat)
# Spec 437 §4 — infrastructure, cost and performance are collected by the TOWN MCP (apps/town-mcp), the only Worker
# that holds a platform read credential. This one asks it over the INFRA service binding and holds none. One cron here.
[triggers]
crons = ["*/5 * * * *"]
[[durable_objects.bindings]]
name = "HEARTBEAT"
class_name = "HeartbeatDO"
[[migrations]]
tag = "v1"
new_sqlite_classes = ["HeartbeatDO"]

[env.faithnet]
name = "faithchain-town-agent"

[[env.faithnet.routes]]
pattern = "town.faithnet.io"
custom_domain = true

[env.faithnet.vars]
# Spec 437 I7 — THE DEMO DOOR. This deployment is a demonstration, so the front page offers a one-click sign-in
# as this persona at the estate's own Home. Whoever opens the page can take it, and because the manifest lists
# this persona among the town's operators they will see what the infrastructure costs. Delete this line and the
# door is gone; nothing else changes, and a real sign-in at a real Home still works.
DEMO_CONNECT = "town-operator"
TOWN = "faithchain"
# The estates' public lanes — GENERATED by `pnpm gen:town` from the manifest. The town pulls each estate's
# heartbeat, and an estate with no zone of its own answers on a workers.dev host a same-account Worker
# cannot fetch; the lane carries the request. Edit towns/*/town.yaml, never this line.
LANE_ROUTES = "edge.faithnet.io=LANE_FAITHNET_1,demo-edge-faithnet.richardpedersen3.workers.dev=LANE_FAITHNET_1,*.faithnet.ai=LANE_FAITHNET_2"  # town:lanes
PUBLIC_ORIGIN = "https://town.faithnet.io"
# The Town Ask (spec 436 §5.5 T1). Both chartered on faithchain 2026-10-11 under demo-admin:
#   faith-town.workspace   0xabAbAD83E69B4cFbf1B90C1c70561D6D770bEef4
#   faith-estate.workspace 0x137Bd996eE74c4288DC8EF2ecEAD5Ee5b448a49C
#   imb-estate.workspace   0xc0D82CdD178Ce2362346e1985127E4ade851Df0A
# secrets CONTEXT_AGENT_CREDENTIALS ({name:{grant,leaf}}) + TOWN_SIGNER_KEY once the stewards issue them (T2).
CONTEXT_AGENTS = "{\"town\":\"faith-town.workspace\",\"estates\":{\"faithnet\":\"faith-estate.workspace\",\"imbnet\":\"imb-estate.workspace\"}}"
CONTEXT_AGENT_ZONE = "faithnet.ai"
VAULT_URL = "https://mcp.faithnet.io"
VAULT_AUDIENCE = "urn:mcp:server:person"
CHAIN_ID = "34348"

# Two town services the portal reads through: the registry (Find) and the naming service (the town of names).
[[env.faithnet.services]]
binding = "REGISTRY"
service = "demo-discovery-a2a-faithnet"

[[env.faithnet.services]]
binding = "NAMING"
service = "faithchain-naming"
[[env.faithnet.services]]
binding = "CHAIN"
service = "faithchain-rpc-gateway"
[[env.faithnet.services]]
binding = "INFERENCE"
service = "faithchain-inference"
# Spec 437 §4 — the town's private MCP: infrastructure status, metrics and cost. It holds the credentials; this Worker does not.
[[env.faithnet.services]]
binding = "INFRA"
service = "faithchain-town-mcp"
[env.faithnet.triggers]
crons = ["*/5 * * * *"]
[[env.faithnet.durable_objects.bindings]]
name = "HEARTBEAT"
class_name = "HeartbeatDO"

# >>> town:lanes faithnet — GENERATED from towns/faithchain/town.yaml by `pnpm gen:town`; edit the manifest, never this block.
[[env.faithnet.services]]
binding = "LANE_FAITHNET_1"
service = "demo-edge-faithnet"   # estate faithnet
[[env.faithnet.services]]
binding = "LANE_FAITHNET_2"
service = "demo-a2a-faithnet"   # estate faithnet
# <<< town:lanes faithnet

# ── hopechain (34349) — the second town's agent ────────────────────────────────────────────────────────────
# Deliberately SMALLER than faithnet's. REGISTRY, NAMING and INFRA are optional bindings and the worker guards
# each one ("the town MCP is not bound on this deployment"), so a town can have a front door before it has a
# registry, a naming service or a private MCP — and say so, rather than pretend. They are added as each lands.
#
# INFERENCE is faithchain's, SHARED: a model gateway is not chain-bound, and a second town does not need a
# second one. The chain gateway is this town's own, because that one is.
[env.hopechain]
name = "hopechain-town-agent"

[[env.hopechain.routes]]
pattern = "hopechain-town.agentkg.io"
custom_domain = true

[env.hopechain.vars]
TOWN = "hopechain"
PUBLIC_ORIGIN = "https://hopechain-town.agentkg.io"
CHAIN_ID = "34349"
# The one estate on this chain, so its vault is the town's read of a person's own records.
VAULT_URL = "https://mcp.impact-agent.io"
VAULT_AUDIENCE = "urn:mcp:server:person"
# No DEMO_CONNECT: the one-click demo door is faithnet's, and a door offered on a town with no operators row
# would take whoever opened it somewhere they are not listed.
# No CONTEXT_AGENTS: the Town Ask's workspaces are chartered on faithchain and do not exist here yet.

[[env.hopechain.services]]
binding = "CHAIN"
service = "hopechain-rpc-gateway"
[[env.hopechain.services]]
binding = "INFERENCE"
service = "faithchain-inference"

[env.hopechain.triggers]
crons = ["*/5 * * * *"]

[[env.hopechain.durable_objects.bindings]]
name = "HEARTBEAT"
class_name = "HeartbeatDO"

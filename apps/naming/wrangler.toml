# The town's naming service (spec 430). Public, keyless, read-only: the API under /api/*, the built app for the rest.
# The BARE name is for `wrangler dev` only (reads `.dev.vars` for RPC_URL).
name = "naming"
main = "worker/index.ts"
compatibility_date = "2026-05-20"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
TOWN = "faithchain"

# FAITHCHAIN — names.faithnet.io. RPC_URL is a SECRET: the town's chain gateway with this Worker's own read-only app
# token (`naming-faithnet`), set with the deploy (`wrangler deploy --env faithnet --secrets-file …`).
[env.faithnet]
name = "faithchain-naming"

[[env.faithnet.routes]]
pattern = "names.faithnet.town"
custom_domain = true
[[env.faithnet.routes]]
pattern = "names.faithnet.io"
custom_domain = true

[env.faithnet.vars]
TOWN = "faithchain"

# The town's registry — asked only "is this agent listed?" (one of the four signals; spec 430 D5).
# THE CHAIN, REACHED AS A BINDING AND NOT OVER THE PUBLIC INTERNET. The gateway is a Worker on this same
# Cloudflare account, and a Worker that fetches another one by its PUBLIC hostname hangs under concurrency: six
# simultaneous reads of /api/town or /api/name left four cancelled by the runtime ("your Worker's code had hung"),
# while /api/health — which reads no chain — answered all six, and the gateway itself answered twelve
# concurrent requests from outside without a wobble (measured 2026-10-14). A binding is a direct call: no edge,
# no loopback.
[[env.faithnet.services]]
binding = "CHAIN"
service = "faithchain-rpc-gateway"

[[env.faithnet.services]]
binding = "REGISTRY"
service = "demo-discovery-a2a-faithnet"

# THE OTHER TOWNS' NAMING SERVICES, by binding (spec 440 §C4 wave 1 — "direct read" through the town's own read API).
# This town is the ROOT: a name free here may still be claimed in another chain's local table (rich-impact.me was born
# on hopechain while the root said "available"), and the page must say so. One binding per peer, named PEER_<TOWN>.
[[env.faithnet.services]]
binding = "PEER_HOPENET"
service = "hopechain-naming"

# Edge rate limit for the public API (admission, never authority).
[[env.faithnet.ratelimits]]
name = "LIMITER"
namespace_id = "2885"
simple = { limit = 240, period = 60 }

# HOPENET — names.hopenet.town. The chain's naming contracts are a LOCAL table (spec 440 C10: names are rooted on faithchain,
# and hopenet issues none for sale), but an estate's Home on this chain still claims there — rich-impact.me was born on
# hopechain on 2026-10-15 and no service could show it. This instance reads that table so the federation resolver sees the
# chain's names, and it sells nothing (no coin, no priced roots). RPC_URL is a SECRET: the hopechain gateway with this
# Worker's own read-only app token (`naming-hopenet`, `?k=` form).
[env.hopenet]
name = "hopechain-naming"

[[env.hopenet.routes]]
pattern = "names.hopenet.town"
custom_domain = true

[env.hopenet.vars]
TOWN = "hopenet"

[[env.hopenet.services]]
binding = "CHAIN"
service = "hopechain-rpc-gateway"

[[env.hopenet.services]]
binding = "REGISTRY"
service = "hopechain-registry"

# THE ROOT TOWN'S NAMING SERVICE (town.yaml `namesRootedAt: faithchain`). Every "does it exist / is it free" answer this
# instance gives comes from here; the local table is shown only as "on this chain". Required: with it missing the
# Worker refuses to answer rather than let the local table pose as a root again (ADR-0013).
[[env.hopenet.services]]
binding = "PEER_FAITHCHAIN"
service = "faithchain-naming"

[[env.hopenet.ratelimits]]
name = "LIMITER"
namespace_id = "2886"
simple = { limit = 240, period = 60 }

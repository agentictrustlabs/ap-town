# Cloudflare Worker — demo-discovery-connector (spec 386). A thin ARD client speaking stateless Streamable HTTP
# MCP for external assistants (Claude.ai custom connector). Public, read-only, rate-limited. It reaches the
# discovery registry over a service binding and NOTHING else: never a ministry's A2A or MCP, never a page.
name = "demo-discovery-connector"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8795

[[services]]
binding = "DISCOVERY"
service = "demo-discovery-a2a"

# ── FAITHNET (chain 34348) — the registry at discovery-a2a.faithnet.io ──
[env.faithnet]
name = "demo-discovery-connector-faithnet"
# Pinned: two accounts deploy this Worker, and wrangler caches the last account it used per project.
account_id = "5da2feaa56593839672948e16c6e809d"

[[env.faithnet.routes]]
pattern = "discovery-connector.faithnet.io"
custom_domain = true

[env.faithnet.vars]
REGISTRY_ORIGIN = "https://discovery-a2a.faithnet.io"
# Spec 387 — the gateway's own agent (gateway.svc, chartered under globalchurch.org; custodied by its steward, the
# Worker holds only a session wire pinned to harness.ask). Secrets: HANDLE_SECRET, GATEWAY_PRIVATE_KEY, GATEWAY_SESSION_WIRE.
GATEWAY_AGENT = "0x3d9af054981994e7e321d545139e68361873f90a"

[[env.faithnet.services]]
binding = "DISCOVERY"
service = "demo-discovery-a2a-faithnet"

# One rate-limit namespace per Worker on the account (edge admission, never authority).
[[env.faithnet.ratelimits]]
name = "LIMITER"
namespace_id = "2884"
simple = { limit = 60, period = 60 }

# ── RICHCANVAS — the Global.Church-facing instance on the r.pedersen@richcanvas.io Cloudflare account ──
# A different account: no service binding can reach the faithnet registry, so this instance reads it over its
# public origin (the ard-client's plain-fetch path — one mechanism, no fallback). Deploy with that account's
# API token in the environment (never the gmail OAuth login):
#   set -a; source apps/demo-discovery-connector/.env.richcanvas.local; set +a
#   pnpm --filter @agenticprimitives-demo/discovery-connector exec wrangler deploy --env richcanvas
# The file holds CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID for that account and is gitignored.
# Custom domain: add a [[env.richcanvas.routes]] entry once a zone on that account is chosen (global.church?);
# until then the Worker answers on its workers.dev hostname.
[env.richcanvas]
name = "gc-discovery-connector"
account_id = "0a1fdbaf6dc871dd3faf7a8d0dc6c534"
workers_dev = true

[env.richcanvas.vars]
REGISTRY_ORIGIN = "https://discovery-a2a.faithnet.io"
GATEWAY_AGENT = "0x3d9af054981994e7e321d545139e68361873f90a"

[[env.richcanvas.ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }


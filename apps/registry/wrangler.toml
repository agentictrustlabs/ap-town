# Cloudflare Worker — demo-discovery-a2a. The agent surface: browser → A2A → MCP → GraphDB.
# In production it reaches the MCP via a SERVICE BINDING (env.MCP) — a Worker can't fetch another
# Worker on the same account by public URL (CF 1042). Local dev falls back to MCP_URL.
name = "demo-discovery-a2a"
main = "src/index.ts"
compatibility_date = "2026-05-19"
compatibility_flags = ["nodejs_compat"]

[dev]
port = 8791

[vars]
MCP_URL = "http://127.0.0.1:8790"
AGENT_NAME = "discovery.agent"

[[services]]
binding = "MCP"
service = "demo-discovery-mcp"

# FAITHNET (chain 34348) — parallel universe. Service-bound to demo-discovery-mcp-faithnet; served on the
# custom domain (card: https://discovery-a2a.faithnet.io/.well-known/agent-card.json). CORS is open (`cors()`),
# so https://discovery.faithnet.io is admitted. The route attaches once the faithnet.io zone is on this account.
[env.faithnet]
name = "demo-discovery-a2a-faithnet"

[[env.faithnet.routes]]
pattern = "discovery-a2a.faithnet.io"
custom_domain = true

[env.faithnet.vars]
# spec 346: the discovery agent IS the `.registry` operator — a typed name claimed on 34348 by a service SA that
# declared `atl:agentType = registry` and created `urn:ap:registry:faithnet-agents` on AgentRegistryBase.
AGENT_NAME = "discovery.registry"  # town:agent
A2A_PUBLIC_ORIGIN = "https://discovery-a2a.faithnet.io"

[[env.faithnet.services]]
binding = "MCP"
service = "demo-discovery-mcp-faithnet"

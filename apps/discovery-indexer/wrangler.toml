# demo-discovery-indexer — targeted-projection HTTP trigger (POST /project). The batch `pnpm index` run
# stays a Node script; this Worker exposes only the on-create projection the home calls.
# Secrets (wrangler secret put): GRAPHDB_USER, GRAPHDB_PASSWORD, RPC_URL (funded RPC recommended).
name = "demo-discovery-indexer"
main = "src/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
GRAPHDB_URL = "https://graphdb.agentkg.io/repositories/smart-agents/statements"
CHAIN_ID = "84532"
NAME_REGISTRY = "0x6629Cca40B008C0984a1Ca266Ca10A344420cac3"
RESOLVER = "0xB890060dE1B3Fd2C78e1f0859da3883743eAD452"
# AgentNameAttributeResolver (spec 280) — the NODE-keyed attribute store where a2aEndpoint / mcpEndpoint /
# appContext / orgRole / serviceUrl / siteUrl actually live. This var was MISSING, so the Worker fell back to
# the stale code default (0x3bed…, 3 subjects) instead of the deployed store (0xA15B…, 142 subjects) and every
# node-keyed record read empty — which is why no apdisc:appContext / approf:a2aEndpoint triple exists in the
# KB. Distinct from RESOLVER (the universal resolver used for resolveName/reverseResolveString).
NAME_RESOLVER = "0xA15B0703716DC8634B74F97723618f74Af3AaA73"
REGISTRY = "0xB18534CA9c679968132ca2a43E454f5fA341030D"
PROFILE_RESOLVER = "0xfcd37F8dca26ead889922b22C169c21370bd352a"
RELATIONSHIP = "0x0AF2455e3f76594E81d9042aD5FE22A5A35dc57f"
ATTESTATION_REGISTRY = "0xD57f2e52395b9C99fAE8Abf823578faFe038f5B7"
DISCOVERY_REGISTRY_ID = "urn:ap:registry:impact-agents"
# Log scans (custody, watcher) use a public RPC with a 2000-block eth_getLogs range (Alchemy free = 10).
LOGS_RPC_URL = "https://sepolia.base.org"
WATCH_MAX_BLOCKS = "20000"

# Event-driven watcher: a cron tick scans new blocks for naming/registry/custody events — plus naming-record
# AttributeSet/Unset (node → SA via resolveName) and profile PropertySet edits (spec 314) — and re-projects
# the affected agents (catches changes made OUTSIDE this home — other apps, CLI).
[triggers]
crons = ["* * * * *"]

# Cursor (last block scanned) for the watcher.
[[kv_namespaces]]
binding = "INDEXER_STATE"
id = "fc19d6789ce34373b6a759c819129434"

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# FAITHNET (Azure faithchain, chain 34348) — a PARALLEL universe: `wrangler deploy --env faithnet`.
# Nothing here touches the production Worker above (Base Sepolia + smart-agents). Addresses come from
# packages/contracts/deployments-faithchain.json (the same table Field/Gather use). Faithnet names live under the
# typed roots (spec 346); the untyped `.impact` root is retired (2026-11-10) and is not indexed.
#
# Secrets (wrangler secret put <NAME> --env faithnet): GRAPHDB_USER, GRAPHDB_PASSWORD
#   RPC_URL      — set below as a var: https://a2a.faithnet.io/rpc (the browser-safe read relay Field's Worker uses; Workers
#                  cannot see the VNet) or https://rpc.faithnet.io with its per-app Bearer (then also
#                  set it as a secret — never a var). LOGS_RPC_URL below is the same relay; if the relay
#                  does not allow eth_getLogs windows, point LOGS_RPC_URL at the gateway via secret.
# REGISTRY = AgentRegistryBase on 34348 (deployed 2026-08-29, deployments-faithchain.json). Set it to ""
#   on any env whose chain has no registry: the empty string projects the facet as ABSENT
#   (src/worker.ts registryFromEnv) — never another chain's address.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
[env.faithnet]
name = "demo-discovery-indexer-faithnet"

[env.faithnet.vars]
GRAPHDB_URL = "https://graphdb.agentkg.io/repositories/smart-agents-faithnet/statements"
CHAIN_ID = "34348"
NAME_REGISTRY = "0x9BE6c96F198a7EDaE0Bb80c98A68EB76Cb85a4bC"
RESOLVER = "0x56B6FBe849356a1D89d024DcA8abf74BF828bF4f"
NAME_RESOLVER = "0x27e993A42E055C52F8fa193883e4fBE08941bE4A"
PROFILE_RESOLVER = "0xc86d67D5ef2ed185e26a5f97f63e506CdA4e45C1"
RELATIONSHIP = "0xa5556Adc4202c1d2dC826a66dBCDad3c50E11BB5"
ATTESTATION_REGISTRY = "0xE135d506b9A9B62e0B5D4F682212c7224aa6566F"
REGISTRY = "0xd6BD744c459F350FCf6A21B5CF8c4F43C92770dC"
# Every root the town's estates name agents under (GENERATED: towns/faithchain/town.yaml → estates[].nameRoots, `pnpm gen:town`). The cron walks THESE and nothing else, so a root that
# is missing here has no periodic backstop — its agents are in the knowledge base only for as long as
# something calls /project for them by hand. This once named a single legacy root while the estate had already
# migrated to typed names (spec 346): 36 of 45 indexed agents were on a root the cron never visited.
# The `.impact` name root is RETIRED (owner, 2026-11-10) and is not in this list: `agent-naming` refuses the root
# (`unknown_tld`), and one refused root would abort the whole walk. An agent whose only name was under it is no
# longer reached by the cron — see SPEC-445-CONSUMER-NOTES.md, "possible live .impact names".
TLDS = "me,org,team,svc,workspace,treasury,registry,church,circle"  # town:roots
DISCOVERY_REGISTRY_ID = "urn:ap:registry:faithnet-agents"
# RPC_URL + LOGS_RPC_URL are SECRETS here: the town's chain gateway (rpc.faithnet.io) with this Worker's own app token
# (spec 429 §5 — never the estate runtime's relay). The Worker refuses to run without them; it has no chain default.
WATCH_MAX_BLOCKS = "20000"
# Spec 413 — a shelf release signed under an agent's DEL-001 session leaf is verified against these (deployments-faithchain.json).
DELEGATION_MANAGER = "0x3BBeCcC7a52E1CE04a3BF7E7404D3BCBF566C490"
UNIVERSAL_SIGNATURE_VALIDATOR = "0x0B4B34b21a4E396489344cDFEe1d15F3EDE7AE4E"
TIMESTAMP_ENFORCER = "0x5A11D8ff4E5Ef341c66C98dFD2441b5858d8e293"
LANE_ROUTES = "edge.faithnet.io=LANE_FAITHNET_1,demo-edge-faithnet.richardpedersen3.workers.dev=LANE_FAITHNET_1,*.faithnet.ai=LANE_FAITHNET_2,test-one-edge.richardpedersen3.workers.dev=LANE_TEST_ONE_1,test-one-runtime.richardpedersen3.workers.dev=LANE_TEST_ONE_2,test-two-edge.richardpedersen3.workers.dev=LANE_TEST_TWO_1,test-two-runtime.richardpedersen3.workers.dev=LANE_TEST_TWO_2,test-three-edge.richardpedersen3.workers.dev=LANE_TEST_THREE_1,test-three-runtime.richardpedersen3.workers.dev=LANE_TEST_THREE_2,isl-1-edge.richardpedersen3.workers.dev=LANE_ISL_1_1,isl-1-runtime.richardpedersen3.workers.dev=LANE_ISL_1_2"  # town:lanes

[env.faithnet.triggers]
crons = ["* * * * *"]

# Separate cursor — different chain, never the production namespace.
[[env.faithnet.kv_namespaces]]
binding = "INDEXER_STATE"
id = "573ce8cd2a8d4ea7878147c7283318ae"

# ── Spec 413 — the public tier's passages (faithnet) ─────────────────────────────────────────────────────────────────
# The indexer is the ONLY writer of the vector index, as it is of the A-box. It embeds (Workers AI) agent descriptions the
# A-box already holds and the works owners made public AND released — verified before projection (ADR-0040 amendment
# 2026-09-24). No vault binding here, ever (`pnpm check:no-vector-over-vault`). One-time setup:
#   wrangler vectorize create ap-public-kb-faithnet --dimensions=768 --metric=cosine
#   wrangler vectorize create-metadata-index ap-public-kb-faithnet --property-name=kind --type=string
#   wrangler queues create shelf-index-faithnet
[env.faithnet.ai]
binding = "AI"

[[env.faithnet.vectorize]]
binding = "KB_VECTORS"
index_name = "ap-public-kb-faithnet"

# Shelf hints (`{owner, entryId}`) from demo-a2a-faithnet's Library acts. A hint names two public identifiers and no
# content; the projector re-reads everything from the owner's public lane and the chain.
[[env.faithnet.queues.consumers]]
queue = "shelf-index-faithnet"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# How the indexer reads an owner's public lane: a Worker cannot fetch a same-account hostname (CF-1042), so each estate
# host is reached through its Worker's service binding, routed by host (`LANE_ROUTES` in [env.faithnet.vars]). On-chain
# `a2aEndpoint`s point at the edge (`https://edge.faithnet.io/api/a2a/<name>`); agent hosts are `<label>.faithnet.ai`.
# >>> town:lanes faithnet — GENERATED from towns/faithchain/town.yaml by `pnpm gen:town`; edit the manifest, never this block.
[[env.faithnet.services]]
binding = "LANE_FAITHNET_1"
service = "demo-edge-faithnet"   # estate faithnet
[[env.faithnet.services]]
binding = "LANE_FAITHNET_2"
service = "demo-a2a-faithnet"   # estate faithnet
[[env.faithnet.services]]
binding = "LANE_TEST_ONE_1"
service = "test-one-edge"   # estate test-one
[[env.faithnet.services]]
binding = "LANE_TEST_ONE_2"
service = "test-one-runtime"   # estate test-one
[[env.faithnet.services]]
binding = "LANE_TEST_TWO_1"
service = "test-two-edge"   # estate test-two
[[env.faithnet.services]]
binding = "LANE_TEST_TWO_2"
service = "test-two-runtime"   # estate test-two
[[env.faithnet.services]]
binding = "LANE_TEST_THREE_1"
service = "test-three-edge"   # estate test-three
[[env.faithnet.services]]
binding = "LANE_TEST_THREE_2"
service = "test-three-runtime"   # estate test-three
[[env.faithnet.services]]
binding = "LANE_ISL_1_1"
service = "isl-1-edge"   # estate isl-1
[[env.faithnet.services]]
binding = "LANE_ISL_1_2"
service = "isl-1-runtime"   # estate isl-1
# <<< town:lanes faithnet

# ─────────────────────────────────────────────────────────────────────────────────────────────────
# hopenet (hopechain, 34349) — THE SECOND TOWN's indexer, the only writer of `smart-agents-hopechain`.
# Addresses come from packages/contracts/deployments-hopechain.json BY KEY, never by copying faithnet's: several
# addresses are identical across the two chains (same deployer, same nonces) and several are NOT — faithnet's
# NAME_REGISTRY address is hopechain's paymaster, and its RESOLVER is hopechain's ontology term registry. An
# address alone no longer says which chain you are on.
#
# Secrets (wrangler secret put <NAME> --env hopenet): GRAPHDB_USER, GRAPHDB_PASSWORD (the `hopechain-discovery`
#   user), RPC_URL and LOGS_RPC_URL (the town's chain gateway with THIS Worker's own `indexer` app token —
#   `https://rpc.hopenet.town/?k=<token>`; the gateway allows eth_getLogs, so both are the same door).
# REGISTRY = "" — no AgentRegistryBase on 34349 yet (deployments-hopechain.json `_incompleteNote`); the empty
#   string projects the facet as ABSENT, never another chain's address.
# ─────────────────────────────────────────────────────────────────────────────────────────────────
[env.hopenet]
name = "hopechain-discovery-indexer"

[env.hopenet.vars]
GRAPHDB_URL = "https://graphdb.agentkg.io/repositories/smart-agents-hopechain/statements"
CHAIN_ID = "34349"
NAME_REGISTRY = "0x3DBf8B380FBeE9fF2C9669A763ca4Be6A03E989c"
RESOLVER = "0xd51aBA0438c93dFf06d2FAe07787d3397b999122"
NAME_RESOLVER = "0x9B34F1eEcbF53A93C6EFB3fCa24FfEAAf67d9044"
PROFILE_RESOLVER = "0x17DD386Ecd2844494F96C8829685E4ffde0DF9fd"
RELATIONSHIP = "0x147Bfc8736cC01566896442dac46499987C21E0d"
ATTESTATION_REGISTRY = "0x79347E0FB5958Adc70C59F46808D32216e90d4e1"
REGISTRY = ""
TLDS = "me,org,team,svc,workspace,treasury,registry,church,circle"  # town:roots
DISCOVERY_REGISTRY_ID = "urn:ap:registry:hopenet-agents"
WATCH_MAX_BLOCKS = "20000"
DELEGATION_MANAGER = "0x80Cb228891D354F466E12a93A1726BFE740f9904"
UNIVERSAL_SIGNATURE_VALIDATOR = "0xC70f4897A92D16a9CF04c1B8646A268cA0fBfE55"
TIMESTAMP_ENFORCER = "0xE46ED59C9AA1e04d42E5C348E66155275358Fa25"
LANE_ROUTES = "edge.impact-agent.io=LANE_IMPACT_AGENT_1,*.impact-agent.ai=LANE_IMPACT_AGENT_2,a2a.impact-agent.io=LANE_IMPACT_AGENT_2,imb-edge.richardpedersen3.workers.dev=LANE_IMPACT_AGENT_1,imb-runtime.richardpedersen3.workers.dev=LANE_IMPACT_AGENT_2"  # town:lanes

[env.hopenet.triggers]
crons = ["* * * * *"]

# Its own cursor — a different chain, never faithnet's namespace.
[[env.hopenet.kv_namespaces]]
binding = "INDEXER_STATE"
id = "93fa1937687d4e2c8225ab52fac9d7ff"

# Spec 413 — the public tier's passages for this chain. Same rule: no vault binding here, ever.
[env.hopenet.ai]
binding = "AI"

[[env.hopenet.vectorize]]
binding = "KB_VECTORS"
index_name = "ap-public-kb-hopechain"

# Shelf hints from the estate's runtime (`imb-runtime` produces to `shelf-index-imb`, created 2026-10-11 with
# no consumer until now). The queue is named for the ESTATE because the producer is the estate's Worker;
# the consumer is the town's indexer, because the public tier is the town's.
[[env.hopenet.queues.consumers]]
queue = "shelf-index-imb"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3

# >>> town:lanes hopenet — GENERATED from towns/hopenet/town.yaml by `pnpm gen:town`; edit the manifest, never this block.
[[env.hopenet.services]]
binding = "LANE_IMPACT_AGENT_1"
service = "imb-edge"   # estate impact-agent
[[env.hopenet.services]]
binding = "LANE_IMPACT_AGENT_2"
service = "imb-runtime"   # estate impact-agent
# <<< town:lanes hopenet

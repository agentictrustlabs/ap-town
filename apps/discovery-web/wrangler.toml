# discovery.faithnet.io — the explorer moved into the Town portal (town.faithnet.io/find). This Worker keeps the host:
# the registry's documents at their well-known paths, and a redirect for everything else (worker/index.ts).
name = "demo-discovery-web"
main = "worker/index.ts"
compatibility_date = "2026-05-20"

[vars]
PORTAL_FIND = "http://localhost:8792/find"

[env.faithnet]
name = "demo-discovery-web-faithnet"

[[env.faithnet.routes]]
pattern = "discovery.faithnet.io"
custom_domain = true

[env.faithnet.vars]
PORTAL_FIND = "https://town.faithnet.io/find"

[[env.faithnet.services]]
binding = "REGISTRY"
service = "demo-discovery-a2a-faithnet"

# discovery.faithnet.io — the explorer moved into the Town portal (town.faithnet.io/find). This Worker keeps the host:
# the registry's documents at their well-known paths, and a redirect for everything else (worker/index.ts).
name = "demo-discovery-web"
main = "worker/index.ts"
compatibility_date = "2026-05-20"

[vars]
PORTAL_FIND = "http://localhost:8792/find"

[env.faithnet]
name = "demo-discovery-web-faithnet"

[[env.faithnet.routes]]
pattern = "discovery.faithnet.town"
custom_domain = true
[[env.faithnet.routes]]
pattern = "discovery.faithnet.io"
custom_domain = true

[env.faithnet.vars]
PORTAL_FIND = "https://town.faithnet.io/find"

[[env.faithnet.services]]
binding = "REGISTRY"
service = "demo-discovery-a2a-faithnet"

# hopenet (34349): the registry's documents at their well-known paths; everything else goes to the portal's Find.
[env.hopenet]
name = "hopechain-discovery-web"

[[env.hopenet.routes]]
pattern = "discovery.hopenet.town"
custom_domain = true

[env.hopenet.vars]
PORTAL_FIND = "https://hopenet.town/find"

[[env.hopenet.services]]
binding = "REGISTRY"
service = "hopechain-registry"
